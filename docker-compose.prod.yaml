# ==============================================================================
# Arquisoft - Docker Compose Production Overrides
# ==============================================================================
# Configuraciones específicas para producción
# - Sin puertos expuestos directamente (solo via Traefik)
# - Recursos optimizados
# - Logging estructurado
# - Restart policies estrictas
#
# Uso: docker-compose -f docker-compose.yaml ... -f docker-compose.prod.yaml up -d
# ==============================================================================

services:
  # ============================================================================
  # PostgreSQL - Producción
  # ============================================================================
  postgres:
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '2'
        reservations:
          memory: 768M
          cpus: '1'

  # ============================================================================
  # RabbitMQ - Producción
  # ============================================================================
  rabbitmq:
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 400M
          cpus: '0.75'
        reservations:
          memory: 256M
          cpus: '0.25'

  # ============================================================================
  # MinIO - Producción
  # ============================================================================
  minio:
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.75'
        reservations:
          memory: 256M
          cpus: '0.25'

  # ============================================================================
  # Keycloak - Producción
  # ============================================================================
  keycloak:
    restart: always
    command: start --import-realm
    environment:
      # Keycloak 26.x: KC_HOSTNAME reemplaza KC_HOSTNAME_URL (deprecado)
      KC_HOSTNAME: https://auth.${DOMAIN:?DOMAIN requerido - configurar en .env}
      KC_HOSTNAME_ADMIN: https://auth.${DOMAIN:?DOMAIN requerido - configurar en .env}
      KC_HOSTNAME_STRICT: true
      KC_HTTP_ENABLED: true
      KC_PROXY_HEADERS: xforwarded
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.5'
        reservations:
          memory: 768M
          cpus: '0.75'

  # ============================================================================
  # Prometheus - Producción
  # ============================================================================
  prometheus:
    restart: always
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 300M
          cpus: '0.5'
        reservations:
          memory: 150M
          cpus: '0.15'

  # ============================================================================
  # Loki - Producción
  # ============================================================================
  loki:
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 300M
          cpus: '0.5'
        reservations:
          memory: 150M
          cpus: '0.15'

  # ============================================================================
  # Grafana - Producción
  # ============================================================================
  grafana:
    restart: always
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: false
      GF_SECURITY_DISABLE_INITIAL_ADMIN_CREATION: false
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
        reservations:
          memory: 128M
          cpus: '0.15'

  # ============================================================================
  # Traefik - Producción
  # ============================================================================
  traefik:
    restart: always
    # Configuración via archivo traefik-prod.yaml (no CLI flags) - HT-001
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
        reservations:
          memory: 128M
          cpus: '0.15'
