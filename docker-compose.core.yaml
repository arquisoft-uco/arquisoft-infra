# ==============================================================================
# Arquisoft - Docker Compose Core Services
# ==============================================================================
# Servicios fundamentales: PostgreSQL, RabbitMQ, MinIO
# Estos servicios son requeridos para que la aplicación funcione
#
# Uso: docker-compose -f docker-compose.yaml -f docker-compose.core.yaml up -d
# ==============================================================================

services:
  # ============================================================================
  # PostgreSQL - Base de datos transaccional
  # ============================================================================
  postgres:
    image: postgres:15-alpine
    container_name: arquisoft-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER requerido - ejecutar scripts/setup-env.sh}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD requerido - ejecutar scripts/setup-env.sh}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB requerido - ejecutar scripts/setup-env.sh}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./configs/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - arquisoft-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.5'
        reservations:
          memory: 512M
          cpus: '0.5'

  # ============================================================================
  # RabbitMQ - Message Queue para eventos asíncronos
  # ============================================================================
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: arquisoft-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?RABBITMQ_USER requerido - ejecutar scripts/setup-env.sh}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD requerido - ejecutar scripts/setup-env.sh}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:?RABBITMQ_VHOST requerido - ejecutar scripts/setup-env.sh}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      - ./configs/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./configs/rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
    networks:
      - arquisoft-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 300M
          cpus: '0.5'
        reservations:
          memory: 200M
          cpus: '0.25'

  # ============================================================================
  # MinIO - Object Storage (S3-compatible) para artefactos
  # ============================================================================
  minio:
    image: minio/minio:RELEASE.2024-01-16T16-07-38Z
    container_name: arquisoft-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER requerido - ejecutar scripts/setup-env.sh}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD requerido - ejecutar scripts/setup-env.sh}
    volumes:
      - minio-data:/data
    networks:
      - arquisoft-network
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 400M
          cpus: '0.5'
        reservations:
          memory: 200M
          cpus: '0.25'

  # ============================================================================
  # MinIO Init - Crear buckets iniciales
  # ============================================================================
  minio-init:
    image: minio/mc:RELEASE.2024-01-16T16-06-34Z
    container_name: arquisoft-minio-init
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER requerido}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD requerido}
    entrypoint: >
      /bin/sh -c "
      mc alias set arquisoft http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD};
      mc mb arquisoft/artefactos --ignore-existing;
      mc mb arquisoft/avatars --ignore-existing;
      mc mb arquisoft/backups --ignore-existing;
      mc anonymous set download arquisoft/avatars;
      echo 'Buckets creados exitosamente';
      exit 0;
      "
    networks:
      - arquisoft-network
