# ==============================================================================
# Arquisoft - Docker Compose Observability Services
# ==============================================================================
# Stack de observabilidad: Prometheus, Loki, Grafana
# Métricas, logs centralizados y dashboards
#
# Uso: docker-compose -f docker-compose.yaml -f docker-compose.observability.yaml up -d
# ==============================================================================

services:
  # ============================================================================
  # Prometheus - Recolección de métricas
  # ============================================================================
  prometheus:
    image: prom/prometheus:latest
    container_name: arquisoft-prometheus
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
    volumes:
      - prometheus-data:/prometheus
      - ./configs/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./configs/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
    networks:
      - arquisoft-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 200M
          cpus: '0.25'
        reservations:
          memory: 100M
          cpus: '0.1'

  # ============================================================================
  # Loki - Agregación de logs
  # ============================================================================
  loki:
    image: grafana/loki:2.9.0
    container_name: arquisoft-loki
    restart: unless-stopped
    command: -config.file=/etc/loki/loki-config.yaml
    volumes:
      - loki-data:/loki
      - ./configs/loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
    networks:
      - arquisoft-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3100/ready || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 200M
          cpus: '0.25'
        reservations:
          memory: 100M
          cpus: '0.1'

  # ============================================================================
  # Promtail - Recolector de logs (envía a Loki)
  # ============================================================================
  promtail:
    image: grafana/promtail:2.9.0
    container_name: arquisoft-promtail
    restart: unless-stopped
    command: -config.file=/etc/promtail/promtail-config.yaml
    volumes:
      - ./configs/promtail/promtail-config.yaml:/etc/promtail/promtail-config.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    networks:
      - arquisoft-network
    depends_on:
      - loki
    deploy:
      resources:
        limits:
          memory: 100M
          cpus: '0.1'

  # ============================================================================
  # Grafana - Dashboards y visualización
  # ============================================================================
  grafana:
    image: grafana/grafana:latest
    container_name: arquisoft-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: false
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:3000}
      GF_INSTALL_PLUGINS: grafana-clock-panel,grafana-piechart-panel
    volumes:
      - grafana-data:/var/lib/grafana
      - ./configs/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./configs/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - arquisoft-network
    depends_on:
      - prometheus
      - loki
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 150M
          cpus: '0.25'
        reservations:
          memory: 100M
          cpus: '0.1'
