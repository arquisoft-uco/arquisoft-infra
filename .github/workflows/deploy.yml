# ==============================================================================
# Arquisoft Infra — Deploy Pipeline
# ==============================================================================
# Despliega la infraestructura en el servidor on-premise via self-hosted runner
# Trigger: manual (workflow_dispatch)
# Runner: Self-hosted (servidor on-premise) — gratis, no consume minutos
#
# Prerequisitos:
#   - Self-hosted runner instalado y corriendo en el servidor
#   - Docker y Docker Compose disponibles
#   - Doppler CLI instalado en el servidor del runner (ver docs/SECRETOS.md)
#   - Secret DOPPLER_TOKEN en cada GitHub Environment (dev / prod): service
#     token de SOLO LECTURA del config correspondiente (dev / prd)
#
# Los secretos se obtienen vía scripts/fetch-secrets.sh (adaptador del baúl);
# el workflow no conoce los valores ni su formato.
# ==============================================================================

name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Entorno de despliegue'
        required: true
        type: choice
        options:
          - dev
          - prod
        default: dev
      components:
        description: 'Componentes (separados por espacio). Vacío = todos.'
        required: false
        type: string
        default: ''

jobs:
  deploy:
    name: Deploy ${{ github.event.inputs.environment }}
    runs-on: self-hosted
    timeout-minutes: 20
    environment: ${{ github.event.inputs.environment }}
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout código
        uses: actions/checkout@v7

      - name: Verificar Docker
        run: |
          docker --version
          docker compose version
          df -h / || true

      - name: Login a GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Generar .env desde el baúl de secretos
        env:
          SECRETS_PROVIDER: doppler
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: |
          if [ -z "$DOPPLER_TOKEN" ]; then
            echo "❌ Secret DOPPLER_TOKEN no configurado en el environment '${{ github.event.inputs.environment }}'"
            exit 1
          fi
          ./scripts/fetch-secrets.sh fetch

      - name: Deploy
        run: ./deploy.sh ${{ github.event.inputs.environment }} up ${{ github.event.inputs.components }}

      - name: Estado de servicios
        if: always()
        run: ./deploy.sh ${{ github.event.inputs.environment }} status || true

      # Los contenedores ya tienen sus variables; el .env no debe quedar en el runner.
      - name: Eliminar .env del runner
        if: always()
        run: shred -u .env 2>/dev/null || rm -f .env
