# ==============================================================================
# Arquisoft Infra — Deploy Pipeline
# ==============================================================================
# Despliega la infraestructura en el servidor on-premise via self-hosted runner
# Trigger: manual (workflow_dispatch)
# Runner: Self-hosted (servidor on-premise) — gratis, no consume minutos
#
# Prerequisitos:
#   - Self-hosted runner instalado y corriendo en el servidor
#   - Docker y Docker Compose disponibles
#   - Secret ENV_FILE con el contenido completo del .env
# ==============================================================================

name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Entorno de despliegue'
        required: true
        type: choice
        options:
          - dev
          - prod
        default: dev
      components:
        description: 'Componentes (separados por espacio). Vacío = todos.'
        required: false
        type: string
        default: ''

jobs:
  deploy:
    name: Deploy ${{ github.event.inputs.environment }}
    runs-on: self-hosted
    timeout-minutes: 20
    environment: ${{ github.event.inputs.environment }}
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout código
        uses: actions/checkout@v6

      - name: Verificar Docker
        run: |
          docker --version
          docker compose version
          df -h / || true

      - name: Login a GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Crear archivo .env desde Secret
        run: |
          echo "${{ secrets.ENV_FILE }}" > .env
          if [ ! -s .env ]; then
            echo "❌ Secret ENV_FILE vacío o no configurado"
            exit 1
          fi
          chmod 600 .env
          echo "✅ .env generado desde secret ($(wc -l < .env) líneas)"

      - name: Deploy
        run: ./deploy.sh ${{ github.event.inputs.environment }} up ${{ github.event.inputs.components }}

      - name: Estado de servicios
        if: always()
        run: ./deploy.sh ${{ github.event.inputs.environment }} status || true
