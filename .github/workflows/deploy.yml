# ==============================================================================
# Arquisoft Infra — Deploy Pipeline
# ==============================================================================
# Despliega la aplicación en el servidor on-premise via self-hosted runner
# Trigger: manual (workflow_dispatch)
# Runner: Self-hosted (servidor on-premise) — gratis, no consume minutos
#
# Prerequisitos:
#   - Self-hosted runner instalado y corriendo en el servidor
#   - Docker y Docker Compose disponibles
#   - Secret ENV_FILE configurado con el contenido del .env
# ==============================================================================

name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Entorno de despliegue'
        required: true
        type: choice
        options:
          - dev
          - prod
        default: dev
      profile:
        description: 'Perfil de servicios'
        required: true
        type: choice
        options:
          - all
          - core
          - auth
        default: all

jobs:
  deploy:
    name: Deploy ${{ github.event.inputs.environment }} (${{ github.event.inputs.profile }})
    runs-on: self-hosted
    timeout-minutes: 15
    environment: ${{ github.event.inputs.environment }}
    defaults:
      run:
        shell: bash

    steps:
      # ── Checkout ──
      - name: Checkout código
        uses: actions/checkout@v4

      # ── Verificar Docker ──
      - name: Verificar Docker
        run: |
          echo "=== Docker Info ==="
          docker --version
          docker compose version
          echo ""
          echo "=== Disk Space ==="
          df -h / || true

      # ── Login GHCR ──
      - name: Login a GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      # ── Generar .env desde Secret ──
      - name: Crear archivo .env
        run: |
          echo "${{ secrets.ENV_FILE }}" > .env
          if [ ! -s .env ]; then
            echo "❌ Secret ENV_FILE vacío o no configurado"
            exit 1
          fi
          echo "✅ .env generado desde secret ($(wc -l < .env) líneas)"

      # ── Generar archivos de configuración ──
      - name: Generar archivos de configuración
        run: |
          # Ejecutar setup-env.sh en modo CI/CD (no-interactivo)
          # Genera solo archivos faltantes: web.yml, .htpasswd, etc.
          # Mantiene .env existente y extrae variables de él
          CI=true SKIP_PROMPTS=true bash scripts/setup-env.sh ${{ github.event.inputs.environment }}

      # ── Deploy ──
      - name: Deploy servicios
        run: bash scripts/start.sh ${{ github.event.inputs.environment }} ${{ github.event.inputs.profile }}

      # ── Health Check ──
      - name: Health check
        run: |
          echo "Esperando 30s para que los servicios inicien..."
          sleep 30
          bash scripts/health-check.sh || true

      # ── Status ──
      - name: Estado de servicios
        if: always()
        run: docker compose -f docker-compose.yaml -f docker-compose.core.yaml ps || true
