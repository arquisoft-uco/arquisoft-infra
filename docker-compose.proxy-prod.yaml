# ==============================================================================
# Arquisoft - Docker Compose Proxy (PRODUCCIÓN)
# ==============================================================================
# Reverse Proxy: Traefik con SSL Let's Encrypt automático
# 
# Uso: 
#   docker-compose -f docker-compose.yaml \
#                  -f docker-compose.core.yaml \
#                  -f docker-compose.auth.yaml \
#                  -f docker-compose.proxy-prod.yaml \
#                  -f docker-compose.prod.yaml up -d
#
# Requisitos:
#   - Dominio apuntando a IP del servidor
#   - Puertos 80 y 443 abiertos
#   - Email válido en ACME_EMAIL
# ==============================================================================

services:
  # ============================================================================
  # Traefik - Reverse Proxy con SSL Automático
  # ============================================================================
  traefik:
    image: traefik:v2.11
    container_name: arquisoft-traefik
    restart: unless-stopped
      
    ports:
      - "80:80"
      - "443:443"
      - "8082:8082"  # Métricas Prometheus (interno)
      # Dashboard NO expuesto directamente - acceso via dominio protegido
      
    environment:
      - TZ=${TIMEZONE:-America/Bogota}
      
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./configs/traefik/traefik-prod.yaml:/etc/traefik/traefik.yaml:ro
      - ./configs/traefik/dynamic-prod:/etc/traefik/dynamic:ro
      - ./configs/traefik/certs/.htpasswd:/etc/traefik/certs/.htpasswd:ro
      - traefik-letsencrypt:/letsencrypt
      - traefik-logs:/var/log/traefik
      
    networks:
      - arquisoft-network
      
    extra_hosts:
      - "host.docker.internal:host-gateway"
      
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
      
    security_opt:
      - no-new-privileges:true
      
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      
    labels:
      # Dashboard accesible solo via HTTPS con autenticación
      - "traefik.enable=true"
      - "traefik.http.routers.traefik-dashboard.rule=Host(`traefik.${DOMAIN:?DOMAIN requerido}`)"
      - "traefik.http.routers.traefik-dashboard.entrypoints=websecure"
      - "traefik.http.routers.traefik-dashboard.tls=true"
      - "traefik.http.routers.traefik-dashboard.tls.certresolver=letsencrypt"
      - "traefik.http.routers.traefik-dashboard.service=api@internal"
      - "traefik.http.routers.traefik-dashboard.middlewares=auth-dashboard"
      # Basic Auth: usar credenciales generadas por setup-env.sh
      # Generar manualmente: htpasswd -nb admin password
      - "traefik.http.middlewares.auth-dashboard.basicauth.usersfile=/etc/traefik/certs/.htpasswd"
      
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
        reservations:
          memory: 64M
          cpus: '0.1'

# ==============================================================================
# Volumes
# ==============================================================================
volumes:
  traefik-letsencrypt:
    name: arquisoft_traefik-letsencrypt
