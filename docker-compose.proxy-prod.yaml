# ==============================================================================
# Arquisoft - Docker Compose Proxy (PRODUCCIÓN)
# ==============================================================================
# Reverse Proxy: Traefik con SSL Let's Encrypt automático
# 
# Uso: 
#   docker-compose -f docker-compose.yaml \
#                  -f docker-compose.core.yaml \
#                  -f docker-compose.auth.yaml \
#                  -f docker-compose.proxy-prod.yaml \
#                  -f docker-compose.prod.yaml up -d
#
# Requisitos:
#   - Dominio apuntando a IP del servidor
#   - Puertos 80 y 443 abiertos
#   - Email válido en ACME_EMAIL
# ==============================================================================

services:
  # ============================================================================
  # Traefik - Reverse Proxy con SSL Automático
  # ============================================================================
  traefik:
    image: traefik:v2.10
    container_name: arquisoft-traefik
    restart: unless-stopped
    command:
      # ========================================
      # API & Dashboard
      # ========================================
      - "--api.dashboard=true"
      - "--api.insecure=false"  # Dashboard protegido en producción
      
      # ========================================
      # Providers
      # ========================================
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=arquisoft-network"
      - "--providers.file.directory=/etc/traefik/dynamic"
      - "--providers.file.watch=true"
      
      # ========================================
      # Entrypoints
      # ========================================
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      
      # Redirección automática HTTP → HTTPS
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--entrypoints.web.http.redirections.entrypoint.permanent=true"
      
      # TLS mínimo 1.2
      - "--entrypoints.websecure.http.tls.options=default"
      
      # ========================================
      # Let's Encrypt (ACME)
      # ========================================
      - "--certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL:-admin@uco.edu.co}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web"
      # Descomentar para staging (pruebas sin límite de rate)
      # - "--certificatesresolvers.letsencrypt.acme.caserver=https://acme-staging-v02.api.letsencrypt.org/directory"
      
      # ========================================
      # Logging
      # ========================================
      - "--log.level=INFO"
      - "--log.format=json"
      - "--accesslog=true"
      - "--accesslog.format=json"
      - "--accesslog.filepath=/var/log/traefik/access.log"
      - "--accesslog.bufferingsize=100"
      
      # ========================================
      # Seguridad & Métricas
      # ========================================
      - "--ping=true"
      - "--ping.entrypoint=websecure"
      - "--metrics.prometheus=true"
      - "--metrics.prometheus.entrypoint=metrics"
      - "--entrypoints.metrics.address=:8082"
      
    ports:
      - "80:80"
      - "443:443"
      - "8082:8082"  # Métricas Prometheus (interno)
      # Dashboard NO expuesto directamente - acceso via dominio protegido
      
    environment:
      - TZ=${TIMEZONE:-America/Bogota}
      
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./configs/traefik/traefik-prod.yaml:/etc/traefik/traefik.yaml:ro
      - ./configs/traefik/dynamic-prod:/etc/traefik/dynamic:ro
      - traefik-letsencrypt:/letsencrypt
      - traefik-logs:/var/log/traefik
      
    networks:
      - arquisoft-network
      
    extra_hosts:
      - "host.docker.internal:host-gateway"
      
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
      
    security_opt:
      - no-new-privileges:true
      
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      
    labels:
      # Dashboard accesible solo via HTTPS con autenticación
      - "traefik.enable=true"
      - "traefik.http.routers.traefik-dashboard.rule=Host(`traefik.${DOMAIN:-arquisoft.uco.edu.co}`)"
      - "traefik.http.routers.traefik-dashboard.entrypoints=websecure"
      - "traefik.http.routers.traefik-dashboard.tls=true"
      - "traefik.http.routers.traefik-dashboard.tls.certresolver=letsencrypt"
      - "traefik.http.routers.traefik-dashboard.service=api@internal"
      - "traefik.http.routers.traefik-dashboard.middlewares=auth-dashboard"
      # Basic Auth: admin:admin123 (cambiar en producción!)
      # Generar con: htpasswd -nb admin password
      - "traefik.http.middlewares.auth-dashboard.basicauth.users=${TRAEFIK_DASHBOARD_AUTH:-admin:$$apr1$$ruca84Hq$$mbjdMZBAG.KWn7vfN/SNK/}"
      
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
        reservations:
          memory: 64M
          cpus: '0.1'

# ==============================================================================
# Volumes
# ==============================================================================
volumes:
  traefik-letsencrypt:
    name: arquisoft_traefik-letsencrypt
  traefik-logs:
    name: arquisoft_traefik-logs
