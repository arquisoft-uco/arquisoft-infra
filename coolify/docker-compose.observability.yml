services:
  loki:
    image: grafana/loki:3.3.2
    container_name: loki
    command: -config.file=/etc/loki/local-config.yaml
    labels:
      - coolify.managed=true
    networks:
      - coolify
    ports:
      # Puerto solo para la red privada entre servidores — restringir con firewall a Server1_PRIVATE_IP
      - "3100:3100"
    volumes:
      - loki-data:/loki
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3100/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 384M

  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: prometheus
    labels:
      - coolify.managed=true
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-remote-write-receiver
    networks:
      - coolify
    ports:
      # Puerto solo para la red privada entre servidores — restringir con firewall a Server1_PRIVATE_IP
      - "9090:9090"
    volumes:
      - prometheus-data:/prometheus
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:9090/-/healthy || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
        reservations:
          cpus: '0.10'
          memory: 192M

  grafana:
    image: grafana/grafana:11.5.0
    container_name: grafana
    labels:
      - coolify.managed=true
      - coolify.proxy.port=3000
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_SERVER_ROOT_URL=https://grafana.arquisoft.top
    networks:
      - coolify
    ports:
      - '3000:3000'
    depends_on:
      - loki
      - prometheus
    volumes:
      - grafana-data:/var/lib/grafana
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
        reservations:
          cpus: '0.05'
          memory: 96M

networks:
  coolify:
    external: true

volumes:
  loki-data:
    name: observability_loki-data
  prometheus-data:
    name: observability_prometheus-data
  grafana-data:
    name: observability_grafana-data
