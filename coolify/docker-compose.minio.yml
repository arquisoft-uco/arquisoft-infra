services:
  minio:
    # pgsty/minio: fork comunitario activo de MinIO bajo AGPL v3
    # Versión anclada — NO usar :latest en producción
    # Verificar nuevos releases en: https://github.com/pgsty/minio/releases
    image: pgsty/minio:RELEASE.2026-04-17T00-00-00Z
    container_name: minio
    command: server /data --console-address ":9001"
    labels:
      - coolify.managed=true
      - traefik.enable=true

      # ── Consola web (puerto 9001) ────────────────────────────────────────────
      # Dominio hardcodeado: las variables de Coolify no se sustituyen en labels.
      # Actualizar este valor si cambia el dominio de la consola.
      - "traefik.http.routers.minio-console.rule=Host(`minio.arquisoft.top`)"
      - traefik.http.routers.minio-console.entrypoints=https
      - traefik.http.routers.minio-console.tls=true
      - traefik.http.routers.minio-console.tls.certresolver=letsencrypt
      - traefik.http.routers.minio-console.service=minio-console
      - traefik.http.services.minio-console.loadbalancer.server.port=9001

      # ── API S3 (puerto 9000) ─────────────────────────────────────────────────
      # Comentado por defecto: la consola autentica internamente via localhost:9000
      # (sin MINIO_SERVER_URL), y el backend accede por red Docker interna.
      #
      # Descomentar y configurar MINIO_SERVER_URL en los casos:
      #   A) Backend en servidor diferente sin red privada compartida
      #   B) Se necesitan presigned URLs para acceso externo directo a objetos
      #
      # También requiere: registro DNS s3.<dominio> → IP del servidor y redeploy
      # para que Let's Encrypt emita el cert antes de intentar el login.
      # - "traefik.http.routers.minio-api.rule=Host(`s3.arquisoft.top`)"
      # - traefik.http.routers.minio-api.entrypoints=https
      # - traefik.http.routers.minio-api.tls=true
      # - traefik.http.routers.minio-api.tls.certresolver=letsencrypt
      # - traefik.http.routers.minio-api.service=minio-api
      # - traefik.http.services.minio-api.loadbalancer.server.port=9000

    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}

      # ── MINIO_SERVER_URL ─────────────────────────────────────────────────────
      # NO definir cuando el API S3 no está expuesto a internet.
      # Sin esta variable la consola autentica via localhost:9000 (siempre accesible).
      #
      # Definir SOLO si los labels del API S3 están descomentados:
      #  - MINIO_SERVER_URL=https://${MINIO_API_DOMAIN}
      #
      # Advertencia: debe existir cert TLS válido en MINIO_API_DOMAIN antes del
      # primer login; de lo contrario la consola retorna 503 al intentar autenticar.

      # ── MINIO_BROWSER_REDIRECT_URL ───────────────────────────────────────────
      # Redirige al browser a la consola cuando accede al puerto S3 vía browser.
      # Solo relevante si el API S3 está expuesto. Sin efecto cuando está comentado.
      # - MINIO_BROWSER_REDIRECT_URL=https://${MINIO_CONSOLE_DOMAIN}

    volumes:
      - minio-data:/data
    networks:
      - coolify
    # Hardening: impide que procesos dentro del contenedor escalen privilegios
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "mcli", "ready", "local"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'

networks:
  coolify:
    external: true

volumes:
  minio-data:
    name: minio_data
