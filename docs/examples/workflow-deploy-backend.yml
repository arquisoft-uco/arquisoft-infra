# =============================================================================
# TEMPLATE — copiar este archivo al repo arquisoft-backend como:
#   .github/workflows/deploy.yml
#
# Secrets requeridos en arquisoft-backend → Settings → Secrets and variables → Actions:
#   DEPLOY_SSH_HOST   IP o hostname del servidor de producción
#   DEPLOY_SSH_USER   usuario SSH con acceso al repo de IaC y al socket Docker
#   DEPLOY_SSH_KEY    clave privada SSH (ed25519 recomendado)
# =============================================================================
name: Build & Deploy Backend

on:
  push:
    branches: [main]

env:
  IMAGE: ghcr.io/arquisoft-uco/arquisoft-backend

jobs:
  build-push:
    name: Build y push imagen
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.meta.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - name: Log in a GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Calcular tag (sha corto)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,prefix=sha-,format=short

      - name: Build y push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy en producción
    needs: build-push
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Cargar clave SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Registrar host en known_hosts
        run: ssh-keyscan -H ${{ secrets.DEPLOY_SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Redeploy vía script de IaC
        env:
          TAG: ${{ needs.build-push.outputs.tag }}
        run: |
          ssh ${{ secrets.DEPLOY_SSH_USER }}@${{ secrets.DEPLOY_SSH_HOST }} \
            "cd /opt/arquisoft-infra && \
             git pull --ff-only && \
             bash scripts/redeploy-app.sh --service backend --tag ${TAG}"
