# ==============================================================================
# Arquisoft - Docker Compose Proxy
# ==============================================================================
# Reverse Proxy: Traefik
# Manejo de rutas, SSL/TLS, load balancing
#
# Uso: docker-compose -f docker-compose.yaml -f docker-compose.proxy.yaml up -d
# ==============================================================================

services:
  # ============================================================================
  # Traefik - Reverse Proxy & Load Balancer
  # ============================================================================
  traefik:
    image: traefik:v2.11
    container_name: arquisoft-traefik
    restart: unless-stopped
    command:
      - "--api.dashboard=true"
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=arquisoft-network"
      - "--providers.file.directory=/etc/traefik/dynamic"
      - "--providers.file.watch=true"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--log.level=INFO"
      - "--accesslog=true"
      - "--metrics.prometheus=true"
      - "--ping=true"
    ports:
      - "80:80"
      - "443:443"
      - "8081:8080"  # Dashboard
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./configs/traefik/dynamic:/etc/traefik/dynamic:ro
      - ./configs/traefik/certs:/etc/traefik/certs:ro
    networks:
      - arquisoft-network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.traefik.rule=Host(`traefik.${DOMAIN:?DOMAIN requerido}`)"
      - "traefik.http.routers.traefik.service=api@internal"
    deploy:
      resources:
        limits:
          memory: 100M
          cpus: '0.1'
        reservations:
          memory: 50M
          cpus: '0.05'
