# ==============================================================================
# Arquisoft - Docker Compose Base
# ==============================================================================
# Este archivo define los recursos compartidos: networks y volumes
# Se usa como base para todos los demás archivos compose
#
# Uso: docker-compose -f docker-compose.yaml -f docker-compose.<modulo>.yaml up -d
# ==============================================================================

networks:
  arquisoft-network:
    name: arquisoft-network
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  # Core
  postgres-data:
    name: arquisoft-postgres-data
  rabbitmq-data:
    name: arquisoft-rabbitmq-data
  minio-data:
    name: arquisoft-minio-data
  
  # Auth
  keycloak-data:
    name: arquisoft-keycloak-data
  
  # Observability
  prometheus-data:
    name: arquisoft-prometheus-data
  loki-data:
    name: arquisoft-loki-data
  grafana-data:
    name: arquisoft-grafana-data
  
  # Proxy / Logs
  traefik-logs:
    name: arquisoft_traefik-logs
