# =============================================================================
# Traefik — Configuración dinámica: middlewares reutilizables
# =============================================================================
# Los servicios referencian estos middlewares por label, p.ej.:
#   traefik.http.routers.<svc>.middlewares=secure-headers@file
# =============================================================================

http:
  middlewares:
    secure-headers:
      headers:
        frameDeny: true
        contentTypeNosniff: true
        browserXssFilter: true
        referrerPolicy: "strict-origin-when-cross-origin"
        stsSeconds: 31536000
        stsIncludeSubdomains: true
        stsPreload: true

    # BasicAuth para consolas administrativas (dashboard, MinIO, RabbitMQ).
    # El archivo .htpasswd lo genera deploy.sh/setup-env.sh en este mismo directorio.
    admin-auth:
      basicAuth:
        usersFile: /etc/traefik/dynamic/.htpasswd
