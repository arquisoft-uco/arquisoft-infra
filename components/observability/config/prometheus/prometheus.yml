# Prometheus Configuration for Arquisoft
# ========================================
# Las métricas del backend y del sistema llegan por REMOTE WRITE desde Grafana
# Alloy (que corre junto al backend). Los jobs de scrape de abajo aplican en
# despliegue single-server (todos los servicios en la misma red Docker); en
# multi-servidor esos targets pueden estar en otro nodo y quedar "down" (normal).

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'arquisoft-monitor'

rule_files:
  - "alerts.yml"

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
        labels:
          service: 'prometheus'

  # --- Scrapes internos (solo single-server / misma red) ---------------------
  - job_name: 'rabbitmq'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['rabbitmq:15692']
        labels:
          service: 'rabbitmq'

  - job_name: 'minio'
    metrics_path: '/minio/v2/metrics/cluster'
    static_configs:
      - targets: ['minio:9000']
        labels:
          service: 'minio'

  - job_name: 'keycloak'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['keycloak:9000']
        labels:
          service: 'keycloak'

  - job_name: 'traefik'
    static_configs:
      - targets: ['traefik:8082']
        labels:
          service: 'traefik'

  - job_name: 'loki'
    static_configs:
      - targets: ['loki:3100']
        labels:
          service: 'loki'
