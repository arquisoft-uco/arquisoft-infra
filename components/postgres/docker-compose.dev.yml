# =============================================================================
# Componente: postgres — overlay DESARROLLO
# =============================================================================
# Expone el puerto a todas las interfaces para que el desarrollador se conecte
# desde su máquina (DBeaver, psql, etc.). Alineado con expose_data_ports=true
# del entorno dev en Terraform.
# =============================================================================

services:
  postgres:
    restart: unless-stopped
    ports:
      - "0.0.0.0:5432:5432"
    environment:
      POSTGRES_LOG_STATEMENT: all
