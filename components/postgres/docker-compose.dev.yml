# =============================================================================
# Componente: postgres — overlay DESARROLLO
# =============================================================================
# Expone el puerto solo al loopback para herramientas locales (psql, DBeaver).
# =============================================================================

services:
  postgres:
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_LOG_STATEMENT: all
