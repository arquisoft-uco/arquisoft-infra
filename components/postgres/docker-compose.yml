# =============================================================================
# Componente: postgres (base de datos de la aplicación) — PRODUCCIÓN
# =============================================================================
# 7 bases de datos por bounded context (usuario arquisoft_user).
# La BD de Keycloak vive en su propio componente (keycloak/keycloak-db).
#
# Solo red interna: NO se expone a Internet. En multi-servidor se accede por la
# IP privada del servidor de datos (puerto 5432 restringido por firewall).
# =============================================================================

services:
  postgres:
    image: postgres:18-alpine
    container_name: arquisoft-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD requerido - ejecutar setup-env.sh}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      APP_DB_USER: ${APP_DB_USER:-arquisoft_user}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?APP_DB_PASSWORD requerido - ejecutar setup-env.sh}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d:ro
    networks:
      - arquisoft-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '2.0'
        reservations:
          memory: 512M
          cpus: '1.0'

networks:
  arquisoft-network:
    external: true

volumes:
  postgres-data:
    name: arquisoft-postgres-data
