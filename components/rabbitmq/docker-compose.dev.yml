# =============================================================================
# Componente: rabbitmq — overlay DESARROLLO
# =============================================================================
# Expone AMQP y consola de gestión a todas las interfaces para que el
# desarrollador se conecte desde su máquina. Deshabilita Traefik (sin TLS en
# dev). Alineado con expose_data_ports=true del entorno dev en Terraform.
# =============================================================================

services:
  rabbitmq:
    restart: unless-stopped
    ports:
      - "0.0.0.0:5672:5672"
      - "0.0.0.0:15672:15672"
    labels:
      - "traefik.enable=false"
