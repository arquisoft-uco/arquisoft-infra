# =============================================================================
# Componente: backend + alloy — overlay DESARROLLO
# =============================================================================
# Expone el API al loopback. Perfil dev de Spring.
# =============================================================================

services:
  backend:
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: dev
      # En dev no hay TLS público: el issuer apunta al Keycloak interno.
      KEYCLOAK_URL: http://${KEYCLOAK_HOST:-keycloak}:8080
      KEYCLOAK_AUTH_SERVER_URL: http://${KEYCLOAK_HOST:-keycloak}:8080
    ports:
      - "127.0.0.1:8080:8080"
    labels:
      - "traefik.enable=false"
      - "monitoring=arquisoft-backend"

