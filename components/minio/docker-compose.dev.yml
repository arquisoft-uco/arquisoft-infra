# =============================================================================
# Componente: minio — overlay DESARROLLO
# =============================================================================
# Expone API y consola al loopback. Sin URLs públicas HTTPS.
# =============================================================================

services:
  minio:
    restart: unless-stopped
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    environment:
      MINIO_SERVER_URL: ""
      MINIO_BROWSER_REDIRECT_URL: ""
    labels:
      - "traefik.enable=false"
