# Promtail Configuration for Arquisoft
# =====================================
# Recolector de logs para envío a Loki

server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push
    tenant_id: arquisoft
    batchwait: 1s
    batchsize: 1048576
    timeout: 10s

scrape_configs:
  # Docker container logs
  - job_name: containers
    static_configs:
      - targets:
          - localhost
        labels:
          job: containers
          environment: development
          __path__: /var/lib/docker/containers/*/*.log

    pipeline_stages:
      - json:
          expressions:
            log: log
            stream: stream
            time: time
            container_id: container_id
      - labels:
          stream:
      - timestamp:
          source: time
          format: RFC3339Nano
      - output:
          source: log

  # Traefik access logs (montado via volume traefik-logs)
  - job_name: traefik
    static_configs:
      - targets:
          - localhost
        labels:
          job: traefik
          service: proxy
          __path__: /var/log/traefik/*.log

    pipeline_stages:
      - json:
          expressions:
            request_host: RequestHost
            request_method: RequestMethod
            request_path: RequestPath
            origin_status: OriginStatus
            downstream_status: DownstreamStatus
            request_duration: Duration
            client_addr: ClientAddr
      - labels:
          request_host:
          request_method:
          origin_status:

  # NOTA: PostgreSQL, Keycloak, RabbitMQ y arquisoft-backend escriben a stdout,
  # capturado automáticamente por el job 'containers' via Docker log driver.
  # No requieren jobs separados ni volume mounts adicionales.

# Relabel configs for service discovery
# (útil si se integra con Docker Swarm o Kubernetes)
