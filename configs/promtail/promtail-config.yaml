# Promtail Configuration for Arquisoft
# =====================================
# Recolector de logs para envío a Loki

server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push
    tenant_id: arquisoft
    batchwait: 1s
    batchsize: 1048576
    timeout: 10s

scrape_configs:
  # Docker container logs
  - job_name: containers
    static_configs:
      - targets:
          - localhost
        labels:
          job: containers
          environment: development
          __path__: /var/lib/docker/containers/*/*.log

    pipeline_stages:
      - json:
          expressions:
            log: log
            stream: stream
            time: time
            container_id: container_id
      - labels:
          stream:
      - timestamp:
          source: time
          format: RFC3339Nano
      - output:
          source: log

  # Arquisoft Application Logs
  - job_name: arquisoft-app
    static_configs:
      - targets:
          - localhost
        labels:
          job: arquisoft
          application: arquisoft-backend
          __path__: /var/log/arquisoft/*.log

    pipeline_stages:
      - multiline:
          firstline: '^\d{4}-\d{2}-\d{2}'
          max_wait_time: 3s
      - regex:
          expression: '^(?P<timestamp>\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}\.\d{3})\s+(?P<level>\w+)\s+\[(?P<thread>[^\]]+)\]\s+(?P<logger>[^\s]+)\s+-\s+(?P<message>.*)$'
      - labels:
          level:
          logger:
          thread:
      - timestamp:
          source: timestamp
          format: '2006-01-02 15:04:05.000'

  # PostgreSQL logs
  - job_name: postgresql
    static_configs:
      - targets:
          - localhost
        labels:
          job: postgresql
          service: database
          __path__: /var/log/postgresql/*.log

    pipeline_stages:
      - multiline:
          firstline: '^\d{4}-\d{2}-\d{2}'
          max_wait_time: 3s
      - regex:
          expression: '^(?P<timestamp>\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}\.\d{3} \w+)\s+(?P<level>\w+):\s+(?P<message>.*)$'
      - labels:
          level:

  # Keycloak logs
  - job_name: keycloak
    static_configs:
      - targets:
          - localhost
        labels:
          job: keycloak
          service: auth
          __path__: /var/log/keycloak/*.log

  # RabbitMQ logs
  - job_name: rabbitmq
    static_configs:
      - targets:
          - localhost
        labels:
          job: rabbitmq
          service: messaging
          __path__: /var/log/rabbitmq/*.log

  # Traefik access logs
  - job_name: traefik
    static_configs:
      - targets:
          - localhost
        labels:
          job: traefik
          service: proxy
          __path__: /var/log/traefik/*.log

    pipeline_stages:
      - json:
          expressions:
            request_host: RequestHost
            request_method: RequestMethod
            request_path: RequestPath
            origin_status: OriginStatus
            downstream_status: DownstreamStatus
            request_duration: Duration
            client_addr: ClientAddr
      - labels:
          request_host:
          request_method:
          origin_status:

