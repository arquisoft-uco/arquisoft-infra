# Traefik Dynamic Configuration for Arquisoft
# =============================================
# Configuración dinámica de rutas y middleware

http:
  # ============================================
  # ROUTERS
  # ============================================
  routers:
    # API Backend
    arquisoft-api:
      rule: "Host(`arquisoft.localhost`) && PathPrefix(`/api`)"
      entryPoints:
        - web
      service: arquisoft-backend
      middlewares:
        - api-stripprefix
        - rate-limit
        - security-headers

    # Frontend (cuando esté disponible)
    arquisoft-frontend:
      rule: "Host(`arquisoft.localhost`)"
      entryPoints:
        - web
      service: arquisoft-frontend
      middlewares:
        - security-headers
      priority: 1

    # Keycloak
    keycloak:
      rule: "Host(`auth.arquisoft.localhost`)"
      entryPoints:
        - web
      service: keycloak

    # MinIO Console
    minio-console:
      rule: "Host(`storage.arquisoft.localhost`)"
      entryPoints:
        - web
      service: minio-console
      middlewares:
        - auth-basic

    # MinIO API
    minio-api:
      rule: "Host(`s3.arquisoft.localhost`)"
      entryPoints:
        - web
      service: minio-api

    # Grafana
    grafana:
      rule: "Host(`grafana.arquisoft.localhost`)"
      entryPoints:
        - web
      service: grafana

    # RabbitMQ Management
    rabbitmq:
      rule: "Host(`rabbitmq.arquisoft.localhost`)"
      entryPoints:
        - web
      service: rabbitmq-management
      middlewares:
        - auth-basic

  # ============================================
  # SERVICES
  # ============================================
  services:
    arquisoft-backend:
      loadBalancer:
        servers:
          - url: "http://host.docker.internal:8080"
        healthCheck:
          path: /actuator/health
          interval: "10s"
          timeout: "3s"

    arquisoft-frontend:
      loadBalancer:
        servers:
          - url: "http://host.docker.internal:3000"

    keycloak:
      loadBalancer:
        servers:
          - url: "http://keycloak:8080"

    minio-console:
      loadBalancer:
        servers:
          - url: "http://minio:9001"

    minio-api:
      loadBalancer:
        servers:
          - url: "http://minio:9000"

    grafana:
      loadBalancer:
        servers:
          - url: "http://grafana:3000"

    rabbitmq-management:
      loadBalancer:
        servers:
          - url: "http://rabbitmq:15672"

  # ============================================
  # MIDDLEWARES
  # ============================================
  middlewares:
    # Strip /api prefix
    api-stripprefix:
      stripPrefix:
        prefixes:
          - "/api"

    # Rate limiting
    rate-limit:
      rateLimit:
        average: 100
        burst: 50
        period: 1s

    # Security headers
    security-headers:
      headers:
        frameDeny: true
        browserXssFilter: true
        contentTypeNosniff: true
        referrerPolicy: "strict-origin-when-cross-origin"
        customResponseHeaders:
          X-Powered-By: ""

    # Basic auth for admin panels (user: admin, pass: admin123)
    auth-basic:
      basicAuth:
        users:
          - "admin:$apr1$ruca84Hq$mbjdMZBAG.KWn7vfN/SNK/"  # admin:admin123
        removeHeader: true

    # Compress responses
    compress:
      compress: {}

    # CORS for API
    cors:
      headers:
        accessControlAllowMethods:
          - GET
          - POST
          - PUT
          - DELETE
          - OPTIONS
        accessControlAllowHeaders:
          - Content-Type
          - Authorization
          - X-Requested-With
        accessControlAllowOriginList:
          - "http://localhost:3000"
          - "http://localhost:4200"
          - "http://arquisoft.localhost"
        accessControlMaxAge: 100
        addVaryHeader: true

# TCP Routers (para PostgreSQL si se necesita acceso externo)
tcp:
  routers:
    postgres:
      entryPoints:
        - postgres
      rule: "HostSNI(`*`)"
      service: postgres

  services:
    postgres:
      loadBalancer:
        servers:
          - address: "postgres:5432"
