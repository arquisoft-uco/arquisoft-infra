# =============================================
# Traefik Static Configuration - Development
# =============================================

# API & Dashboard
api:
  dashboard: true
  insecure: true  # Dashboard accesible sin auth en dev

# Entrypoints
entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
  websecure:
    address: ":443"
  metrics:
    address: ":8082"

# Providers
providers:
  docker:
    exposedByDefault: false
    network: arquisoft-network
  file:
    directory: /etc/traefik/dynamic
    watch: true

# Logging
log:
  level: INFO

accessLog: {}

# Ping for healthcheck
ping: {}

# Metrics (mismo puerto que producción para consistencia con Prometheus)
metrics:
  prometheus:
    entryPoint: metrics