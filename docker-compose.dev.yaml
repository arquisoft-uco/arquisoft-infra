# ==============================================================================
# Arquisoft - Docker Compose Development Overrides
# ==============================================================================
# Configuraciones específicas para desarrollo local
# - Puertos expuestos al host
# - Recursos reducidos
# - Modo debug habilitado
#
# Uso: docker-compose -f docker-compose.yaml -f docker-compose.core.yaml -f docker-compose.dev.yaml up -d
# ==============================================================================

services:
  # ============================================================================
  # PostgreSQL - Exponer puerto para herramientas locales (solo loopback)
  # ============================================================================
  postgres:
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_LOG_STATEMENT: all

  # ============================================================================
  # RabbitMQ - Exponer puertos de gestión
  # ============================================================================
  rabbitmq:
    ports:
      - "127.0.0.1:5672:5672"      # AMQP (solo loopback)
      - "127.0.0.1:15672:15672"    # Management UI (solo loopback)

  # ============================================================================
  # MinIO - Exponer puertos de API y consola
  # ============================================================================
  minio:
    ports:
      - "127.0.0.1:9000:9000"      # API (solo loopback)
      - "127.0.0.1:9001:9001"      # Console (solo loopback)

  # ============================================================================
  # Keycloak - Exponer puerto de admin
  # ============================================================================
  keycloak:
    ports:
      - "127.0.0.1:8080:8080"      # Solo loopback

  # ============================================================================
  # Prometheus - Exponer para queries directas
  # ============================================================================
  prometheus:
    ports:
      - "127.0.0.1:9090:9090"      # Solo loopback

  # ============================================================================
  # Loki - Exponer para push directo de logs en dev
  # ============================================================================
  loki:
    ports:
      - "127.0.0.1:3100:3100"      # Solo loopback

  # ============================================================================
  # Grafana - Exponer dashboards
  # ============================================================================
  grafana:
    ports:
      - "127.0.0.1:3000:3000"      # Solo loopback
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: true
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
